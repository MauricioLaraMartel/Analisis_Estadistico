<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meta 18834 | Unidad de Estadística</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">

  <style>
    .construccion {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      text-align: center;
      padding: 40px 20px;
      background-color: #f4f6f9;
    }

    .construccion-caja {
      background-color: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 50px 40px;
      border-radius: 10px;
      border-top: 6px solid #0f69b4;
      box-shadow: 0 4px 14px rgba(10, 19, 45, 0.08);
    }

    .construccion-icono {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .construccion h1 {
      color: #0a132d;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .construccion h2 {
      color: #0f69b4;
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 20px;
      padding-bottom: 0;
    }

    .construccion h2::after {
      display: none;
    }

    .construccion p {
      color: #5f6b7a;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .boton-volver {
      display: inline-block;
      padding: 12px 28px;
      background-color: #0f69b4;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .boton-volver:hover {
      background-color: #0a4f8a;
    }
  </style>
</head>
<body>

  <div class="barra-gobierno">
    <span class="azul"></span>
    <span class="rojo"></span>
  </div>

  <section class="construccion">
    <div class="construccion-caja">
      <div class="construccion-icono">🚧</div>
      <h1>Meta 18834</h1>
      <h2>Página en construcción</h2>
      <p>Estamos trabajando en esta sección. Pronto estará disponible la información.</p>
      <a href="index.html#indicadores" class="boton-volver">← Volver al inicio</a>
    </div>
  </section>

</body>
</html>
